<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Difesa Planetaria — Controllo</title>
<style>
  :root {
    --bg: #070b10; --panel: #0c131c; --line: #1b2836; --ink: #d6e4f0; --dim: #6b8199;
    --ok: #35d07f; --warn: #f2b01e; --bad: #ff4d5e; --saga: #6aa9ff; --shield: #4cc9f0;
  }
  * { box-sizing: border-box; }

  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .console { flex-direction: row; align-items: center; gap: 14px; padding: 7px 12px; }
  .status { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none;
            margin-left: 14px; box-shadow: 0 0 6px currentColor; color: var(--dim); }
  .status.live { background: var(--ok); color: var(--ok); }
  .status.down { background: var(--bad); color: var(--bad); animation: blink 1s steps(2) infinite; }

  .defcon { display: flex; flex-direction: column; gap: 3px; padding-right: 18px; flex: none;
            border-right: 1px solid var(--line); }
  .defcon .head { font-size: 26px; font-weight: 800; line-height: 1; letter-spacing: .06em;
                  font-variant-numeric: tabular-nums; white-space: nowrap; }
  .defcon .head .n { font-size: 34px; }
  .defcon .word { font-size: 15px; font-weight: 700; letter-spacing: .22em; line-height: 1; }
  .defcon .bars { display: flex; gap: 4px; margin-top: 3px; }
  .defcon .bars i { width: 15px; height: 4px; background: #1b2836; border-radius: 1px; }

  .defcon[data-level="5"] { --dc: var(--ok); }
  .defcon[data-level="4"] { --dc: var(--shield); }
  .defcon[data-level="3"] { --dc: var(--warn); }
  .defcon[data-level="2"] { --dc: #ff8c42; }
  .defcon[data-level="1"] { --dc: var(--bad); }
  .defcon .head, .defcon .word { color: var(--dc, var(--ink)); }
  .defcon .bars i.on { background: var(--dc); box-shadow: 0 0 5px var(--dc); }
  .defcon[data-level="1"] .head, .defcon[data-level="1"] .word { animation: blink 1.1s ease-in-out infinite; }


  .layout { display: grid; grid-template-columns: minmax(320px, 2fr) 3fr; gap: 10px; flex: 1; min-height: 0; }
  .right { display: grid; grid-template-rows: 2fr 3fr; gap: 10px; min-height: 0; }
  @media (max-width: 1000px) {
    body { height: auto; }
    .layout { grid-template-columns: 1fr; }
    .right { grid-template-rows: 260px 360px; }
    #log { max-height: 60vh; }
  }

  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
            display: flex; flex-direction: column; min-height: 0; position: relative; }
  h2 { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); margin: 0 0 8px;
       font-weight: 600; display: flex; align-items: center; gap: 7px; }
  h2::before { content: ""; width: 5px; height: 5px; background: var(--shield); border-radius: 1px;
               box-shadow: 0 0 5px var(--shield); flex: none; }

  section::before, section::after {
    content: ""; position: absolute; width: 9px; height: 9px; pointer-events: none;
    border: 1px solid var(--shield); opacity: .45;
  }
  section::before { top: 4px; left: 4px; border-right: 0; border-bottom: 0; }
  section::after { bottom: 4px; right: 4px; border-left: 0; border-top: 0; }
  svg { width: 100%; height: 100%; flex: 1; min-height: 0; display: block; }

  #log { overflow-y: auto; flex: 1; }
  .row { display: grid; grid-template-columns: 62px 22px 1fr; gap: 6px; padding: 4px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row.new { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: #17324a; } to { background: transparent; } }
  .row time, .row .where { color: var(--dim); }
  .row .emoji { text-align: center; }
  .row.ok .what { color: var(--ok); } .row.warn .what { color: var(--warn); }
  .row.bad .what { color: var(--bad); } .row.saga .what { color: var(--saga); }
  .empty { color: var(--dim); }

  .star { fill: #9fb3c8; }
  .mother { filter: drop-shadow(0 4px 10px rgba(0,0,0,.65)); }
  .mother .hull { fill: #3b4760; stroke: #a8bbd8; stroke-width: 1.5; }
  .mother .dome { fill: #55658a; stroke: #c6d5ee; stroke-width: 1.2; }
  .mother .light { fill: #ff4d5e; filter: drop-shadow(0 0 4px rgba(255,77,94,.95));
                   animation: blink 2s ease-in-out infinite; }
  .mother .light:nth-child(odd) { animation-delay: 1s; }
  @keyframes blink { 50% { opacity: .55; } }
  .mother .bar-bg { fill: #24161a; stroke: var(--line); stroke-width: .8; }
  .mother .bar { fill: var(--ok); transition: width 1s ease; }
  .mother.critical .bar { fill: var(--warn); }
  .mother.dead .hull, .mother.dead .dome { stroke: #3a3f4d; fill: #12141b; }
  .mother.dead .light { display: none; }
  .mother text { fill: var(--dim); font-size: 10px; text-anchor: middle; }

  .fleet { transition: transform 1.2s linear; }
  .fleet .hull { fill: #ff4d5e; stroke: #ffe3e6; stroke-width: .9; transition: opacity .25s;
                 filter: drop-shadow(0 0 4px rgba(255,77,94,.9)); }
  .fleet .dome { fill: #ffb3ba; stroke: #fff; stroke-width: .6; }
  .fleet .spur { stroke: #ffe3e6; stroke-width: 1.2; stroke-linecap: round; }
  .fleet .ring { fill: none; stroke: #ff8c9a; stroke-width: .8; stroke-dasharray: 3 3; opacity: .8; }
  .fleet text { fill: var(--ink); font-size: 10px; text-anchor: middle; transition: opacity .3s; }
  .fleet text.target { fill: var(--dim); font-size: 9px; }
  .fleet .hp-bg { fill: #24161a; stroke: var(--line); stroke-width: .7; }
  .fleet .hp { fill: var(--bad); transition: width .4s ease; }
  .fleet.hurt .hp { fill: var(--warn); }
  .fleet.dying .hp { fill: var(--ok); }
  .fleet.resolved .hull, .fleet.resolved .dome, .fleet.resolved .spur, .fleet.resolved .ring,
  .fleet.resolved .hp, .fleet.resolved .hp-bg, .fleet.resolved text { opacity: 0; }
  .fleet .body { transform-box: fill-box; transform-origin: center; }
  .fleet.resolved.bad .body { animation: dive 1.6s ease-in forwards; }
  .fleet.resolved.bad .saucer { opacity: 1; fill: var(--bad); }
  @keyframes dive { to { opacity: 0; transform: translate(0px, 90px) scale(.5); } }
  .boom .ring { fill: none; stroke: #ffd166; stroke-width: 2.5; animation: ring 1.1s ease-out forwards; }
  .boom .core { fill: #fff3b0; animation: core .9s ease-out forwards; }
  .boom .ray { stroke: #ff9f1c; stroke-width: 2; stroke-linecap: round; animation: rays 1s ease-out forwards; }
  @keyframes ring { from { r: 3; opacity: 1; } to { r: 34; opacity: 0; stroke-width: .5; } }
  @keyframes core { from { r: 10; opacity: 1; } to { r: 1; opacity: 0; } }
  @keyframes rays { to { transform: scale(3.2); opacity: 0; } }

  .overlay[hidden], .verdict[hidden] { display: none; }

  button {
    font: inherit; cursor: pointer; border-radius: 5px; padding: 9px 20px;
    background: var(--ok); color: #05130b; border: 0; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase;
  }
  button:hover { filter: brightness(1.12); }
  button:disabled { opacity: .5; cursor: progress; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 600; }
  button.ghost:hover { border-color: var(--shield); }

  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             flex-direction: column; gap: 14px; background: rgba(7,11,16,.86); border-radius: 6px;
             text-align: center; padding: 20px; z-index: 2; }
  .overlay p { margin: 0; color: var(--dim); max-width: 44ch; }
  .overlay .title { font-size: 17px; letter-spacing: .12em; }

  #report { position: fixed; inset: 12px 16px; background: var(--panel); border: 1px solid var(--line);
            border-radius: 6px; padding: 18px 22px; overflow-y: auto; z-index: 10;
            display: flex; flex-direction: column; gap: 14px; }
  #report[hidden] { display: none; }
  .report-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .report-head b { font-size: 18px; letter-spacing: .1em; }
  .report-head.win b { color: var(--ok); } .report-head.lose b { color: var(--bad); }
  .report-head .sub { color: var(--dim); }
  .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
  .metric { border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; }
  .metric .n { font-size: 22px; font-weight: 700; }
  .metric .k { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .09em; }
  .metric.ok .n { color: var(--ok); } .metric.bad .n { color: var(--bad); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px 8px; border-top: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.fallen td { color: var(--bad); }
  .report-actions { display: flex; gap: 10px; margin-top: auto; padding-top: 6px; }

  .verdict { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             flex-direction: column; gap: 6px; background: rgba(7,11,16,.72); border-radius: 6px;
             font-size: 15px; letter-spacing: .1em; text-align: center; padding: 20px; }
  .verdict b { font-size: 22px; }
  .verdict .actions { display: flex; gap: 10px; }
  .verdict.win b { color: var(--ok); } .verdict.lose b { color: var(--bad); }

  .terra { display: grid; grid-template-columns: auto 1fr; gap: 14px; flex: 1; min-height: 0; }
  .arsenal { display: flex; flex-direction: column; gap: 6px; justify-content: center;
             border-right: 1px solid var(--line); padding-right: 14px; }
  .arsenal h3 { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
                margin: 0 0 2px; font-weight: 600; }
  .arsenal .u { display: flex; align-items: baseline; gap: 7px; white-space: nowrap; }
  .arsenal .u b { font-size: 17px; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
  .arsenal .u.total b { font-size: 26px; }
  .arsenal .u.empty b, .arsenal .u.empty span { color: var(--dim); opacity: .5; }
  @media (max-width: 1000px) { .terra { grid-template-columns: 1fr; } .arsenal { border-right: 0; } }

  .gridline { stroke: #132030; stroke-width: 1; }
  .city .core { fill: #16304a; stroke: var(--shield); stroke-width: 1.5; }
  .city .shield { fill: none; stroke: var(--shield); stroke-width: 1.5; opacity: 0; stroke-dasharray: 4 3; }
  .city.shields-up .shield { opacity: .9; animation: spin 6s linear infinite; }
  @keyframes spin { to { stroke-dashoffset: -70; } }
  .city .threat { fill: none; stroke: var(--bad); stroke-width: 1.5; opacity: 0; }
  .city.under-attack .threat { opacity: 1; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { r: 30; opacity: .3; } }
  .city .vector { stroke: var(--bad); stroke-width: 1; stroke-dasharray: 3 4; opacity: 0; }
  .city.under-attack .vector { opacity: .7; animation: flow 1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -14; } }
  .city .name { fill: var(--ink); font-size: 11px; font-weight: 600; text-anchor: middle; }
  .city .stat { fill: var(--ink); font-size: 10px; text-anchor: middle; }
  .city .incoming { fill: var(--bad); font-size: 10px; text-anchor: middle; }
  .city .life-bg { fill: #24161a; stroke: var(--line); stroke-width: .8; }
  .city .life { fill: var(--ok); transition: width .8s ease; }
  .city.hurt .life { fill: var(--warn); }
  .city.critical .life { fill: var(--bad); }
  .city.fallen .core { fill: #1a1a1a; stroke: #444; }
  .city.fallen .name { fill: #666; text-decoration: line-through; }
  .city.fallen .shield, .city.fallen .threat, .city.fallen .vector { display: none; }
  .city.fallen .life { fill: var(--bad); }
</style>
</head>
<body>

<section class="console">
  <div id="defcon" class="defcon"></div>
  <span id="conn" class="status" title="collegamento"></span>
</section>

<div class="layout">
  <section>
    <h2>Eventi</h2>
    <div id="log" class="empty">in attesa del primo avvistamento…</div>
  </section>
  <div class="right">
    <section>
      <h2>Spazio</h2>
      <svg id="space" viewBox="0 0 600 240" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="idle" class="overlay" hidden>
        <div class="title">🛸 Nessuna campagna in corso</div>
        <p>Cinque citta', cinque cannoni, e un numero di colpi che non si ricarica da solo. Trentasei
           navi in un'unica ondata: si resiste con quello che non e' stato sprecato.</p>
        <button id="start-btn">Inizia la campagna</button>
      </div>
      <div id="verdict" class="verdict" hidden></div>
    </section>
    <section>
      <h2>Terra</h2>
      <div class="terra">
        <div id="arsenal" class="arsenal"></div>
        <svg id="map" viewBox="0 0 600 320" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </section>
  </div>
</div>

<div id="report" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, text) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  return n;
};

const CITY_POS = {
  '11111111-0000-0000-0000-000000000002': [70, 110],
  '11111111-0000-0000-0000-000000000005': [200, 228],
  '11111111-0000-0000-0000-000000000004': [330, 110],
  '11111111-0000-0000-0000-000000000003': [440, 228],
  '11111111-0000-0000-0000-000000000001': [540, 105],
};
const posOf = (cityId) => CITY_POS[cityId] || [300, 160];

const STEPS = {
  'detected':             ['🛸', 'avvistamento'],
  'fire':                 ['🔫', 'fuoco aperto'],
  'shot':                 ['💢', 'colpo'],
  'missed':               ['🎯', 'bersaglio mancato'],
  'cease':                ['🛑', 'cessate il fuoco'],
  'no-cannon':            ['🚫', 'nessun cannone'],
  'jammed':               ['🔩', 'inceppato'],
  'repaired':             ['🔧', 'riparato'],
  'empty':                ['🈳', 'a secco'],
  'resupply-dispatched':  ['📦', 'convoglio chiamato'],
  'resupplied':           ['📦', 'convoglio arrivato'],
  'wasted':               ['🕳️', 'colpo su un relitto'],
  'destroyed':            ['💥', 'abbattuta'],
  'landed':               ['👽', 'atterrata'],
  'city-fallen':          ['🏚️', 'citta perduta'],
  'wave-start':           ['📯', 'ondata'],
};

const CANNON = {
  'ready':        ['🟢', 'pronto'],
  'firing':       ['🔫', 'in azione'],
  'jammed':       ['🔩', 'inceppato'],
  'empty':        ['🈳', 'a secco'],
  'resupplying':  ['📦', 'in rifornimento'],
  'lost':         ['🏚️', 'perduto'],
};

const DEFCON = {
  5: ['FADE OUT', 'nessuna minaccia'],
  4: ['DOUBLE TAKE', 'campagna in corso'],
  3: ['ROUND HOUSE', 'navi in avvicinamento'],
  2: ['FAST PACE', 'perdite a terra'],
  1: ['COCKED PISTOL', 'difesa al collasso'],
};

function defconOf(s) {
  const e = s.earth, a = s.aliens;
  if (s.invasion.status === 'idle') return 5;
  if (e.citiesStanding <= 1) return 1;
  if (e.citiesStanding < e.citiesTotal) return 2;
  if (a.shipsInFlight > 0) return 3;

  return 4;
}

function renderConsole(s) {
  const level = defconOf(s);
  const [word, caption] = DEFCON[level];
  const box = $('defcon');
  box.dataset.level = level;
  box.title = caption;
  box.innerHTML = `<div class="head">DEFCON <span class="n">${level}</span></div>
    <div class="word">${word}</div>
    <div class="bars">${[5, 4, 3, 2, 1].map((n) => `<i class="${n >= level ? 'on' : ''}"></i>`).join('')}</div>`;
}

function renderArsenal(earth, steps) {
  const sparati = (steps.shot || 0) + (steps.missed || 0) + (steps.wasted || 0);
  $('arsenal').innerHTML = `<h3>Arsenale</h3>
    <div class="u total ${earth.roundsLeft ? '' : 'empty'}">🔫 <b>${earth.roundsLeft}</b> <span>colpi</span></div>
    <h3 style="margin-top:12px">Consumo</h3>
    <div class="u">💢 <b>${sparati}</b> <span>sparati</span></div>
    <div class="u ${steps.missed ? '' : 'empty'}">🎯 <b>${steps.missed || 0}</b> <span>mancati</span></div>
    <div class="u ${steps.wasted ? '' : 'empty'}">🕳️ <b>${steps.wasted || 0}</b> <span>su relitti</span></div>
    <div class="u ${steps.jammed ? '' : 'empty'}">🔩 <b>${steps.jammed || 0}</b> <span>inceppamenti</span></div>
    <div class="u ${steps['resupply-dispatched'] ? '' : 'empty'}">📦 <b>${steps['resupply-dispatched'] || 0}</b> <span>rifornimenti</span></div>`;
}

const seen = new Set();
function resetLog() {
  seen.clear();
  $('log').className = 'empty';
  $('log').textContent = "in attesa del primo avvistamento…";
}
function renderLog(log) {
  const box = $('log');
  const fresh = [...log].filter((e) => !seen.has(e.id)).sort((a, b) => new Date(a.at) - new Date(b.at));
  if (!fresh.length) return;
  if (box.classList.contains('empty')) { box.className = ''; box.innerHTML = ''; }
  const first = seen.size === 0;
  for (const e of fresh) {
    seen.add(e.id);
    const [emoji, label] = STEPS[e.step] || ['•', e.step];
    const t = new Date(e.at).toLocaleTimeString('it-IT', { hour12: false });
    const row = document.createElement('div');
    row.className = `row ${esc(e.tone)} ${first ? '' : 'new'}`;
    row.innerHTML = `<time>${t}</time><span class="emoji">${emoji}</span><span>
      <span class="what">${esc(e.detail)}</span>
      <span class="where">${e.cityName ? `— ${esc(e.cityName)} ` : ''}· ${esc(label)}</span></span>`;
    box.prepend(row);
  }
}

const space = $('space');
for (let i = 0; i < 90; i++)
  space.appendChild(el('circle', { class: 'star', cx: Math.random() * 600, cy: 40 + Math.random() * 200,
    r: Math.random() * 1.1 + .2, opacity: Math.random() * .7 + .2 }));

const mother = el('g', { class: 'mother', transform: 'translate(300, 24)' });
mother.appendChild(el('ellipse', { class: 'hull', rx: 190, ry: 15 }));
mother.appendChild(el('ellipse', { class: 'dome', cx: 0, cy: -9, rx: 70, ry: 11 }));
for (let x = -160; x <= 160; x += 40) mother.appendChild(el('circle', { class: 'light', cx: x, cy: 4, r: 2 }));
const BAR_W = 340;
mother.appendChild(el('rect', { class: 'bar-bg', x: -BAR_W / 2, y: 24, width: BAR_W, height: 6, rx: 3 }));
const motherBar = el('rect', { class: 'bar', x: -BAR_W / 2, y: 24, width: BAR_W, height: 6, rx: 3 });
mother.appendChild(motherBar);
const motherText = el('text', { y: 42 }, 'nave madre');
mother.appendChild(motherText);
space.appendChild(mother);

function renderMother(inv) {
  const ratio = inv.totalShips ? inv.shipsRemaining / inv.totalShips : 0;
  motherBar.setAttribute('width', Math.max(0, BAR_W * ratio));
  motherText.textContent = inv.totalShips
    ? `${inv.shipsRemaining}/${inv.totalShips} navi ancora da fermare`
    : 'nave madre in posizione';
  mother.classList.toggle('critical', ratio > 0 && ratio < .25);
  mother.classList.toggle('dead', inv.shipsRemaining === 0);
}

const fleets = new Map();
const removed = new Set();
const lastLane = new Map();
let lastThreats = [];
let lastLanes = new Map();
const SHAPES = {
  'caccia': { h: 6, bar: 26, draw: () => [
    el('path', { class: 'hull', d: 'M0,-6 L7,5 L0,2 L-7,5 Z' }),
    el('circle', { class: 'dome', cy: -1, r: 1.8 }),
  ] },
  'incrociatore': { h: 6, bar: 34, draw: () => [
    el('ellipse', { class: 'hull', rx: 13, ry: 5 }),
    el('ellipse', { class: 'hull', cx: -14, rx: 3.5, ry: 2.4 }),
    el('ellipse', { class: 'hull', cx: 14, rx: 3.5, ry: 2.4 }),
    el('ellipse', { class: 'dome', cy: -1.6, rx: 5, ry: 2.6 }),
  ] },
  'corazzata': { h: 10, bar: 46, draw: () => [
    el('ellipse', { class: 'ring', rx: 26, ry: 10 }),
    el('ellipse', { class: 'hull', rx: 20, ry: 7.5 }),
    el('path', { class: 'spur', d: 'M-20,0 L-28,-5 M20,0 L28,-5' }),
    el('ellipse', { class: 'dome', cy: -2.6, rx: 8.5, ry: 3.8 }),
    el('circle', { class: 'dome', cx: -10, cy: 1.5, r: 1.4 }),
    el('circle', { class: 'dome', cx: 10, cy: 1.5, r: 1.4 }),
  ] },
};
const shapeOf = (cls) => SHAPES[cls] || SHAPES['caccia'];

const LANE_FROM = 75, LANE_TO = 525;
const SKY = 96, GROUND = 214;

function lanesFor(threats) {
  const flying = threats.filter((t) => t.status === 'incoming');
  const ordered = [...flying].sort((a, b) => posOf(a.cityId)[0] - posOf(b.cityId)[0] ||
    new Date(a.detectedAt) - new Date(b.detectedAt));
  const lanes = new Map();
  ordered.forEach((t, i) => {
    lanes.set(t.id, ordered.length === 1
      ? posOf(t.cityId)[0]
      : LANE_FROM + i * (LANE_TO - LANE_FROM) / (ordered.length - 1));
  });

  return lanes;
}

function fleetTransform(t, lanes) {
  const x = lanes.get(t.id) ?? lastLane.get(t.id) ?? posOf(t.cityId)[0];
  lastLane.set(t.id, x);
  const age = Date.now() - new Date(t.detectedAt).getTime();
  const progress = Math.min(1, age / 25000);
  return `translate(${x}, ${SKY + progress * (GROUND - SKY)})`;
}

function buildFleet(t) {
  const shape = shapeOf(t.class);
  const g = el('g', { class: 'fleet', 'data-id': t.id, 'data-class': t.class });
  const body = el('g', { class: 'body' });

  for (const piece of shape.draw()) body.appendChild(piece);

  const barY = shape.h + 6;
  body.appendChild(el('rect', { class: 'hp-bg', x: -shape.bar / 2, y: barY, width: shape.bar, height: 3, rx: 1.5 }));
  body.appendChild(el('rect', { class: 'hp', x: -shape.bar / 2, y: barY, width: shape.bar, height: 3, rx: 1.5 }));

  body.appendChild(el('text', { y: barY + 13, class: 'count' }, hits(t)));
  body.appendChild(el('text', { y: barY + 25, class: 'target' }, `→ ${t.cityName}`));
  g.appendChild(body);

  return g;
}

const hits = (t) => `${t.class}${t.cannonsFiring ? ` 🔫${t.cannonsFiring}` : ' ⚠'}`;

function setHp(g, t) {
  const shape = shapeOf(t.class);
  const left = Math.max(0, 1 - t.hits / Math.max(1, t.hitsToDestroy));
  g.querySelector('.hp').setAttribute('width', shape.bar * left);
  g.classList.toggle('hurt', left <= .6 && left > .3);
  g.classList.toggle('dying', left <= .3);
}

function explode(g) {
  const boom = el('g', { class: 'boom', transform: 'translate(0, 6)' });
  boom.appendChild(el('circle', { class: 'core', r: 10 }));
  boom.appendChild(el('circle', { class: 'ring', r: 3 }));
  for (let i = 0; i < 8; i++)
    boom.appendChild(el('line', { class: 'ray', x1: 0, y1: -4, x2: 0, y2: -12, transform: `rotate(${i * 45})` }));
  g.appendChild(boom);
}

function renderSpace(threats) {
  lastThreats = threats;
  lastLanes = lanesFor(threats);
  for (const t of threats) {
    if (removed.has(t.id)) continue;
    let g = fleets.get(t.id);
    if (!g) { g = buildFleet(t); fleets.set(t.id, g); space.appendChild(g); }
    g.setAttribute('transform', fleetTransform(t, lastLanes));
    g.querySelector('.count').textContent = hits(t);
    setHp(g, t);
    if (t.status !== 'incoming' && !g.classList.contains('resolved')) {
      const landed = t.status === 'landed';
      g.classList.add('resolved', landed ? 'bad' : 'ok');
      if (!landed) explode(g);
      removed.add(t.id);
      setTimeout(() => { g.remove(); fleets.delete(t.id); }, 1500);
    }
  }
}
setInterval(() => {
  for (const t of lastThreats) {
    const g = fleets.get(t.id);
    if (g && !g.classList.contains('resolved')) g.setAttribute('transform', fleetTransform(t, lastLanes));
  }
}, 1000);

let reportOpen = false;

function renderInvasion(inv) {
  $('idle').hidden = inv.status !== 'idle';

  const over = inv.status === 'over';
  const box = $('verdict');
  box.hidden = !over || reportOpen;
  if (over && !reportOpen) {
    box.className = `verdict ${inv.gameOver ? 'lose' : 'win'}`;
    box.innerHTML = `<b>${titolo(inv)}</b><span>${esc(inv.verdict)}</span>`;
    box.appendChild(button('Nuova campagna', '', startCampaign));
    box.appendChild(button('Vedi il resoconto', 'ghost', () => { reportOpen = true; render(last); }));
  }

  $('report').hidden = !(over && reportOpen);
  if (over && reportOpen) renderReport(inv.summary);
  if (!over) reportOpen = false;
}

function titolo(inv) {
  return inv.gameOver ? '👽 TERRA CADUTA' : '🏆 INVASIONE RESPINTA';
}

function button(label, cls, onClick) {
  const b = document.createElement('button');
  b.className = cls;
  b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}

function metric(label, value, tone = '') {
  return `<div class="metric ${tone}"><div class="n">${value}</div><div class="k">${label}</div></div>`;
}

function renderReport(s) {
  if (!s) return;
  const mm = String(Math.floor(s.durationSeconds / 60)).padStart(2, '0');
  const ss = String(s.durationSeconds % 60).padStart(2, '0');
  const box = $('report');
  box.innerHTML = `
    <div class="report-head ${s.gameOver ? 'lose' : 'win'}">
      <b>${s.gameOver ? '👽 TERRA CADUTA' : '🏆 INVASIONE RESPINTA'}</b>
      <span class="sub">${s.gameOver ? 'ondata interrotta' : 'ondata superata'} · durata ${mm}:${ss}</span>
    </div>
    <p style="margin:0;color:var(--dim)">${esc(s.verdict)}</p>
    <div class="report-grid">
      ${metric('citta in piedi', `${s.citiesStanding}/${s.citiesTotal}`, s.citiesStanding === s.citiesTotal ? 'ok' : 'bad')}
      ${metric('navi lanciate', s.shipsLaunched)}
      ${metric('navi abbattute', s.shipsDestroyed, 'ok')}
      ${metric('navi atterrate', s.shipsLanded, s.shipsLanded ? 'bad' : '')}
    </div>
    <div class="report-grid">
      ${metric('🔫 colpi sparati', s.roundsSpent)}
      ${metric('🎯 bersagli mancati', s.steps.missed || 0)}
      ${metric('🕳️ colpi su relitti', s.roundsWasted, s.roundsWasted ? 'bad' : 'ok')}
      ${metric('🔩 inceppamenti', s.steps.jammed || 0)}
      ${metric('📦 rifornimenti', s.steps['resupply-dispatched'] || 0)}
      ${metric('🎯 colpi rimasti', s.roundsLeft, s.roundsLeft ? 'ok' : 'bad')}
    </div>
    <table>
      <thead><tr><th>Citta'</th><th class="num">Integrita'</th><th class="num">Colpi</th>
        <th>Cannone</th></tr></thead>
      <tbody>${s.cities.map((c) => `<tr class="${c.fallen ? 'fallen' : ''}">
        <td>${esc(c.name)}${c.fallen ? ' — perduta' : ''}</td>
        <td class="num">${c.integrity}%</td>
        <td class="num">${c.rounds}</td>
        <td>${(CANNON[c.cannon] || ['❔', c.cannon]).join(' ')}</td></tr>`).join('')}</tbody>
    </table>
    <div class="report-actions"></div>`;
  const actions = box.querySelector('.report-actions');
  actions.appendChild(button('Nuova campagna', '', startCampaign));
  actions.appendChild(button('Chiudi', 'ghost', () => { reportOpen = false; render(last); }));
}

async function post(url, e) {
  const btn = e?.currentTarget;
  if (btn) btn.disabled = true;
  try {
    await fetch(url, { method: 'POST' });
  } finally {
    if (btn) btn.disabled = false;
  }
}

const startCampaign = (e) => post('/earth/campaign/start', e);

$('start-btn').addEventListener('click', startCampaign);

const map = $('map');
for (let x = 0; x <= 600; x += 50) map.appendChild(el('line', { class: 'gridline', x1: x, y1: 0, x2: x, y2: 320 }));
for (let y = 0; y <= 320; y += 50) map.appendChild(el('line', { class: 'gridline', x1: 0, y1: y, x2: 600, y2: y }));
const cities = new Map();
const LIFE_W = 60;

function buildCity(c) {
  const [x, y] = posOf(c.id);
  const g = el('g', { class: 'city', 'data-id': c.id, transform: `translate(${x}, ${y})` });
  g.appendChild(el('line', { class: 'vector', x1: 0, y1: -y, x2: 0, y2: -22 }));
  g.appendChild(el('circle', { class: 'threat', r: 24 }));
  g.appendChild(el('circle', { class: 'shield', r: 17 }));
  g.appendChild(el('circle', { class: 'core', r: 9 }));
  g.appendChild(el('text', { class: 'name', y: -26 }, c.name));
  g.appendChild(el('rect', { class: 'life-bg', x: -LIFE_W / 2, y: 24, width: LIFE_W, height: 5, rx: 2 }));
  g.appendChild(el('rect', { class: 'life', x: -LIFE_W / 2, y: 24, width: LIFE_W, height: 5, rx: 2 }));
  g.appendChild(el('text', { class: 'stat', y: 42 }));
  g.appendChild(el('text', { class: 'stat', y: 54 }));
  g.appendChild(el('text', { class: 'incoming', y: 68 }));
  return g;
}

function renderMap(earth, threats) {
  const attacked = new Map();
  for (const t of threats)
    if (t.status === 'incoming') attacked.set(t.cityId, (attacked.get(t.cityId) || 0) + 1);
  for (const c of earth.cities) {
    let g = cities.get(c.id);
    if (!g) { g = buildCity(c); cities.set(c.id, g); map.appendChild(g); }
    g.classList.toggle('shields-up', c.cannon === 'firing' && !c.fallen);
    g.classList.toggle('under-attack', attacked.has(c.id) && !c.fallen);
    g.classList.toggle('hurt', c.integrity < 67 && !c.fallen);
    g.classList.toggle('critical', c.integrity < 34 && !c.fallen);
    g.classList.toggle('fallen', c.fallen);
    g.querySelector('.life').setAttribute('width', Math.max(0, LIFE_W * c.integrity / 100));
    const [riga1, riga2] = g.querySelectorAll('.stat');
    const [emoji, stato] = CANNON[c.cannon] || ['❔', c.cannon];
    riga1.textContent = c.fallen ? 'rasa al suolo' : `${emoji} ${stato}`;
    riga2.textContent = c.fallen ? '' : `🔫 ${c.rounds} colpi`;
    const incoming = attacked.get(c.id);
    g.querySelector('.incoming').textContent = incoming && !c.fallen
      ? `🛸 ${incoming} ${incoming === 1 ? 'nave' : 'navi'} in arrivo` : '';
  }
}

let last = null;
let shownWave = null;

function render(s) {
  if (shownWave !== null && s.invasion.wave !== shownWave) {
    resetLog();
    for (const [, g] of fleets) g.remove();
    fleets.clear();
    removed.clear();
  }
  shownWave = s.invasion.wave;
  last = s;

  renderConsole(s);
  renderArsenal(s.earth, s.steps);
  renderLog(s.log);
  renderMother(s.invasion);
  renderSpace(s.ships);
  renderInvasion(s.invasion);
  renderMap(s.earth, s.ships);
}

const source = new EventSource('/earth/stream');
source.onopen = () => { $('conn').className = 'status live'; $('conn').title = 'collegato'; };
source.onerror = () => { $('conn').className = 'status down'; $('conn').title = 'collegamento perso, riprovo…'; };
source.onmessage = (e) => { try { render(JSON.parse(e.data)); } catch {} };
</script>
